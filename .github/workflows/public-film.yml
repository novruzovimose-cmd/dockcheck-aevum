name: Verify hosted desk and publish Aevum film
on:
  workflow_run:
    workflows: [Package release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install recording tools
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check public endpoints and capture the Aevum flow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/site-v$version" --jq .commit.sha)
          gh release download "v$version" --pattern 'DockCheck-*.zip' -D "$RUNNER_TEMP/desk"
          unzip -q "$RUNNER_TEMP/desk/DockCheck-$version.zip" 'DockCheck/dist/*' -d "$RUNNER_TEMP/desk"
          python -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/desk/DockCheck/dist" >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for site in "https://rawcdn.githack.com/$GITHUB_REPOSITORY/$sha/index.html" "https://raw.githack.com/$GITHUB_REPOSITORY/site-v$version/index.html" "http://127.0.0.1:4173/"; do
            if python scripts/record_public.py "$site" Aevum-payment.mp4; then
              echo "Browser verified $site"
              echo "Verified Aevum payment and invoice comparison at $site" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: aevum-film
          path: Aevum-payment.mp4
  publish:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: aevum-film
      - name: Attach the verified walkthrough to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          gh release upload "v$version" Aevum-payment.mp4 --clobber
